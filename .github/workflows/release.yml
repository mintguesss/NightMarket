# 推送 v* 標籤（例如 git tag v1.0.0 && git push origin v1.0.0）時，
# 在 GitHub 的 Windows 主機上打包 NightMarket.exe 並附在 Release 上。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          python tools/gen_icons.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name NightMarket --icon web/icons/app.ico `
            --add-data "web;web" --hidden-import server --hidden-import strategy `
            launcher.pyw
      - uses: actions/upload-artifact@v4
        with:
          name: NightMarket-windows
          path: dist/NightMarket.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NightMarket.exe
          generate_release_notes: true
