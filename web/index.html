<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151821">
<title>台美股看盤</title>
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<div class="app" id="app">
  <nav class="nav" id="nav">
    <div class="mswitch" id="mktSwitch" role="tablist" aria-label="切換市場"></div>
    <button class="nav-btn active" data-view="chart"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg><span>看盤</span></button>
    <button class="nav-btn" data-view="market"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg><span>市場</span></button>
    <button class="nav-btn" data-view="rank"><svg viewBox="0 0 24 24"><path d="M4 20V12M10 20V4M16 20v-6M3 20h18"/></svg><span>排行</span></button>
    <button class="nav-btn" data-view="options"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM12 4v16M4 12h16"/></svg><span>期權</span></button>
    <button class="nav-btn" data-view="news"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span>觀察</span></button>
    <button class="nav-btn" data-view="calendar"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>日曆</span></button>
    <button class="nav-btn" data-view="paper"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M8 6V4h8v2M3 12h18"/></svg><span>模擬倉</span></button>
    <button class="nav-btn m-only" data-act="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg><span>更多</span></button>
    <div class="nav-spacer"></div>
    <button class="nav-btn" data-act="index"><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 6-8 3 3"/></svg><span>大盤</span></button>
    <button class="nav-btn" data-act="alerts"><svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 0112 0c0 7 3 8 3 8H3s3-1 3-8M10 21h4"/></svg><span>提醒</span></button>
    <button class="nav-btn" data-act="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg><span>設定</span></button>
  </nav>

  <aside class="watch" id="watchPanel">
    <div class="watch-head">
      <span class="watch-title">自選股</span>
      <span class="watch-count" id="watchCount"></span>
      <span class="flex1"></span>
      <button class="icon-btn" id="watchMenuBtn" title="清單選項">⋯</button>
      <button class="icon-btn" data-collapse="left" title="收合">«</button>
    </div>
    <div class="chips" id="watchTabs"></div>
    <div class="watch-cols" id="watchCols"><span data-sort="name">名稱代碼</span><span></span><span data-sort="price">成交價</span><span data-sort="pct">漲跌幅</span><span data-sort="chg">漲跌</span></div>
    <div class="watch-list" id="watchList"></div>
  </aside>
  <div class="resizer" data-resize="left"><button class="rz-btn" data-collapse="left">‹</button></div>

  <main class="center">
    <header class="topbar">
      <button class="m-back" id="mBack" title="返回">‹</button>
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="searchInput" placeholder="代號或名稱：2330、台積電、AAPL、nvidia" autocomplete="off">
        <div class="search-drop" id="searchDrop"></div>
      </div>
      <div class="top-quote" id="topQuote"></div>
    </header>

    <!-- 看盤 -->
    <section class="view" id="viewChart">
      <div class="toolbar">
        <div class="periods" id="periods">
          <button data-p="tick">分時</button>
          <button data-p="5d">5日</button>
          <span class="sep"></span>
          <button data-p="D">日K</button>
          <button data-p="W">週K</button>
          <button data-p="M">月K</button>
          <span class="sep"></span>
          <button data-p="1">1分</button>
          <button data-p="5">5分</button>
          <button data-p="15">15分</button>
          <button data-p="30">30分</button>
          <button data-p="60">60分</button>
          <div class="more" id="morePeriods">
            <button class="more-btn" id="moreBtn">更多 ▾</button>
            <div class="more-menu" id="moreMenu">
              <div class="more-group">分鐘</div>
              <button data-p="2">2分</button><button data-p="3">3分</button><button data-p="10">10分</button><button data-p="90">90分</button>
              <div class="more-group">小時</div>
              <button data-p="120">2小時</button><button data-p="240">4小時</button>
              <div class="more-group">長週期</div>
              <button data-p="Q">季K</button><button data-p="Y">年K</button>
            </div>
          </div>
        </div>
        <div class="overlay-sel" id="overlaySel"></div>
      </div>
      <div class="chart-area">
        <div class="draw-bar" id="drawBar"></div>
        <div class="chart-wrap" id="chartWrap">
          <div class="pane pane-main" id="paneMain"><div class="legend" id="legendMain"></div><div id="chartMain" class="chart"></div></div>
          <div class="pane pane-sub" id="paneSub1"><div class="legend" id="legendSub1"></div><div id="chartSub1" class="chart"></div></div>
          <div class="pane pane-sub" id="paneSub2"><div class="legend" id="legendSub2"></div><div id="chartSub2" class="chart"></div></div>
          <div class="loading" id="loading">載入中…</div>
        </div>
      </div>
      <div class="ind-tabs" id="indTabs"></div>
    </section>

    <section class="view" id="viewMarket" hidden>
      <div class="toolbar"><b class="view-title">全球市場</b><span class="muted small">點卡片可以開走勢圖</span><span class="flex1"></span><span class="rank-upd" id="marketUpd"></span></div>
      <div class="scroll-body" id="marketBody"></div>
    </section>

    <section class="view" id="viewRank" hidden>
      <div class="toolbar">
        <div class="seg" id="rankMkt"><button data-m="tw" class="active">台股</button><button data-m="us">美股</button></div>
        <div class="periods" id="rankType">
          <button data-r="gainers" class="active">漲幅</button>
          <button data-r="losers">跌幅</button>
          <button data-r="volume">成交量</button>
          <button data-r="value">成交值</button>
        </div>
        <label class="chk" id="rankEtfWrap"><input type="checkbox" id="rankEtf" checked> 含 ETF</label>
        <span class="rank-upd" id="rankUpd"></span>
        <button class="btn-ghost" id="rankRefresh">重新整理</button>
      </div>
      <div class="scroll-body" id="rankBody"></div>
    </section>

    <section class="view" id="viewOptions" hidden>
      <div class="toolbar">
        <div class="seg" id="optUnd"><button data-u="TXO" class="active">台指選擇權</button><button data-u="US">美股選擇權</button></div>
        <input class="tin" id="optSym" placeholder="美股代號 如 AAPL" hidden>
        <select class="tsel" id="optExp"></select>
        <select class="tsel" id="optRange"><option value="10">價平 ±10 檔</option><option value="20" selected>價平 ±20 檔</option><option value="0">全部</option></select>
        <span class="flex1"></span>
        <span class="rank-upd" id="optUpd"></span>
      </div>
      <div class="opt-head" id="optHead"></div>
      <div class="scroll-body" id="optBody"></div>
    </section>

    <section class="view" id="viewNews" hidden>
      <div class="toolbar"><b class="view-title">觀察</b><span class="muted small">個股新聞與市場快訊（點標題開啟原文）</span><span class="flex1"></span><button class="btn-ghost" id="newsRefresh">重新整理</button></div>
      <div class="news-cols">
        <div class="news-col"><div class="news-title" id="newsStockTitle">個股新聞</div><div class="news-list" id="newsStock"></div></div>
        <div class="news-col"><div class="news-title">市場快訊 <span class="seg mini" id="newsCat"><button data-c="all" class="active">全部</button><button data-c="台股">台股</button><button data-c="國際股">國際</button></span></div><div class="news-list" id="newsMarket"></div></div>
      </div>
    </section>

    <section class="view" id="viewCalendar" hidden>
      <div class="toolbar">
        <b class="view-title">日曆</b>
        <button class="btn-ghost" id="calPrev">‹</button>
        <input type="date" class="tin" id="calDate">
        <button class="btn-ghost" id="calNext">›</button>
        <button class="btn-ghost" id="calToday">今天</button>
        <label class="chk"><input type="checkbox" id="calMine"> 只看自選相關</label>
      </div>
      <div class="week-strip" id="calWeek"></div>
      <div class="scroll-body" id="calBody"></div>
    </section>

    <section class="view" id="viewPaper" hidden>
      <div class="toolbar">
        <b class="view-title">模擬倉</b>
        <span class="muted small">虛擬資金，不會真的下單。台股含手續費 0.1425%（最低 20 元）與證交稅；美股以零手續費計。</span>
        <span class="flex1"></span>
        <button class="btn-ghost" id="paperReset">重設帳戶</button>
      </div>
      <div class="scroll-body" id="paperBody"></div>
    </section>
  </main>

  <div class="resizer" data-resize="right"><button class="rz-btn" data-collapse="right">›</button></div>
  <aside class="side" id="sidePanel">
    <div class="side-head">
      <div>
        <div class="side-name" id="sideName">—</div>
        <div class="side-code" id="sideCode"></div>
      </div>
      <div class="side-acts">
        <button class="icon-btn" id="alertBtn" title="設定提醒">🔔</button>
        <button class="fav" id="favBtn" title="加入/移除自選">♥</button>
        <button class="icon-btn" data-collapse="right" title="收合">»</button>
      </div>
    </div>
    <div class="side-price" id="sidePrice"></div>
    <div class="side-status" id="sideStatus"></div>
    <div class="side-note" id="sideNote" hidden></div>
    <div class="qgrid" id="qgrid"></div>
    <div class="side-tabs" id="sideTabs">
      <button data-t="book" class="active">五檔</button>
      <button data-t="inst">法人</button>
      <button data-t="trade">模擬下單</button>
      <button data-t="news">新聞</button>
    </div>
    <div class="side-body">
      <div id="tabBook"></div>
      <div id="tabInst" hidden></div>
      <div id="tabTrade" hidden></div>
      <div id="tabNews" hidden></div>
    </div>
  </aside>

  <footer class="foot" id="foot">
    <span class="mkt" id="mktStat"></span>
    <span class="foot-idxs" id="footIdx"></span>
    <span class="foot-spacer"></span>
    <span class="foot-src" id="srcNote"></span>
    <span id="clock"></span>
  </footer>
</div>
<div class="ctx-menu" id="ctxMenu"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script src="indicators.js"></script>
<script src="draw.js"></script>
<script src="app.js"></script>
<script src="pages.js"></script>
<script src="mobile.js"></script>
</body>
</html>
